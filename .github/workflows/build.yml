name: Manual Java Workspace Build & Auto-Release

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [dependency_updated]

# ⚠️ CRITICAL: Gives GitHub permission to create tags and publish releases
permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the JSE FrontEnd code
      - name: Checkout JSEFrontEnd
        uses: actions/checkout@v4.2.2
        with:
          path: JSEFrontEnd

      # 2. Pull down the DictionaryCore code
      - name: Checkout DictionaryCore
        uses: actions/checkout@v4.2.2
        with:
          repository: AAccount/dictionary_core
          path: DictionaryCore

      # 3. Pull down the CedictParser code
      - name: Checkout CedictParser
        uses: actions/checkout@v4.2.2
        with:
          repository: AAccount/dictionary_cedictparser
          path: CedictParser

      # 4. Set up the Java JDK
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21' # Match your local VS Code Java version
          distribution: 'temurin'

      # 5. Gather all java files across folders and compile them
      - name: Compile Java Code
        run: |
          mkdir -p bin
          # Find all .java files across the three source directories
          find CedictParser/src DictionaryCore/src JSEFrontEnd/src -name "*.java" > sources.txt
          
          # Compile using the JAR file already inside your checked-out DictionaryCore folder
          javac -cp "DictionaryCore/lib/sqlite-jdbc-3.53.2.0.jar" -d bin @sources.txt

      # 6. Extract the SQLite JAR into the bin folder for a standalone app
      - name: Extract Dependencies
        run: |
          cd bin
          jar -xf ../DictionaryCore/lib/sqlite-jdbc-3.53.2.0.jar
          # Remove the embedded manifest file so it doesn't overwrite your main one
          rm -rf META-INF/MANIFEST.MF

      # 7. Package compiled class files into a single production JAR
      - name: Package JAR file
        run: |
          echo "Main-Class: dt.jdictionary.App" > manifest.txt
          
          # Package the bin contents into a final jar
          jar cfm DictionaryJava.jar manifest.txt -C bin .

      # 8. Create a unique Version Tag based on the exact date and time
      - name: Generate Release Tag
        id: tag_gen
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M')"
          echo "generated_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      # 9. Create a GitHub Release and attach the Standalone executable
      - name: Deploy GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_gen.outputs.generated_tag }}
          name: "Automated Build: ${{ steps.tag_gen.outputs.generated_tag }}"
          body: |
            This release was automatically generated following a commit update.
            
            **Changes Included:** This build synchronizes the latest modifications across your core dictionary mechanics, database drivers, and frontend application.
          draft: false
          prerelease: false
          files: |
            DictionaryJava.jar      
