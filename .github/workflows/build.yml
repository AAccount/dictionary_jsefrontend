      # 2. Pull down the DictionaryCore code
      - name: Checkout DictionaryCore
        uses: actions/checkout@v4
        with:
          repository: AAccount/dictionary_core
          token: ${{ secrets.BUILD_TRIGGER_TOKEN }}
          path: DictionaryCore

      # 3. Pull down the CedictParser code
      - name: Checkout CedictParser
        uses: actions/checkout@v4
        with:
          repository: AAccount/dictionary_cedictparser
          token: ${{ secrets.BUILD_TRIGGER_TOKEN }}
          path: CedictParser

      # 4. Set up the Java JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Match your local VS Code Java version
          distribution: 'temurin'

      # 5. Download the referenced SQLite dependency
      - name: Download SQLite JDBC Driver
        run: |
          mkdir -p lib
          curl -L -o lib/sqlite-jdbc-3.53.2.0.jar https://maven.org

      # 6. Gather all java files across folders and compile them
      - name: Compile Java Code
        run: |
          mkdir -p bin
          # Find all .java files across the three source directories
          find CedictParser/src DictionaryCore/src JSEFrontEnd/src -name "*.java" > sources.txt
          
          # Compile everything into the bin directory using the SQLite jar as the classpath
          javac -cp "lib/sqlite-jdbc-3.53.2.0.jar" -d bin @sources.txt

      # 7. Package compiled class files into a single production JAR
      - name: Package JAR file
        run: |
          # Replace 'com.example.Main' with the actual full package name of your Main class
          echo "Main-Class: com.example.Main" > manifest.txt
          echo "Class-Path: sqlite-jdbc-3.53.2.0.jar" >> manifest.txt
          
          # Package the bin contents into a final jar
          jar cfm DictionaryApp.jar manifest.txt -C bin .

      # 8. Store the compiled Jar file on GitHub
      - name: Upload Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dictionary-jar
          path: DictionaryApp.jar
