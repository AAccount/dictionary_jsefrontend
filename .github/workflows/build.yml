You can see they each have their own src folder. How can I automate github so when any commit is made to these 3, it automatically builds in the jse front end repo?To automatically trigger a build in your dictionary_jsefrontend repository whenever a commit is pushed to either dictionary_core or dictionary_cedictparser, you should use GitHub Actions with a repository_dispatch event.Because GitHub restricts repositories from listening directly to other repositories for security reasons, the two dependency repos must explicitly "ping" the frontend repo via the GitHub API when code updates.Step 1: Create a Fine-Grained Personal Access Token (PAT)You need an authentication token so your dependency repositories have permission to trigger a workflow in your frontend repository.Go to your GitHub Settings -> Developer Settings -> Personal Access Tokens -> Fine-grained tokens.Click Generate new token. Name it something like TRIGGER_FRONTEND_BUILD.Under Repository access, select Only select repositories and choose dictionary_jsefrontend.Under Permissions, click Repository permissions and change Contents to Read and Write (this allows dispatch events).Generate the token and copy it immediately.Step 2: Save the Token as a Secret in the Dependency ReposYou must add this token to both dictionary_core and dictionary_cedictparser.Go to the GitHub page for dictionary_core.Click Settings -> Secrets and variables -> Actions.Click New repository secret.Name it DEPENDENCY_TRIGGER_TOKEN and paste your token value.Repeat these exact steps for dictionary_cedictparser.Step 3: Add Trigger Workflows to the Dependency ReposIn both dictionary_core and dictionary_cedictparser, create a new file at .github/workflows/trigger-frontend.yml.This workflow will run on every push to the main (or master) branch and send a notification to the frontend.yamlname: Trigger Frontend Build

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

jobs:
  ping-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Send Repository Dispatch Event
        run: |
          curl -H "Authorization: token ${{ secrets.DEPENDENCY_TRIGGER_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST \
               -d '{"event_type": "dependency_updated"}' \
               https://github.com
Use code with caution.Step 4: Configure the Build Workflow in the Frontend RepoIn your dictionary_jsefrontend repository, create or update your build workflow file at .github/workflows/build.yml.Configure it to listen for standard code pushes AND the custom repository_dispatch event we created in Step 3:yamlname: Java Frontend Build

