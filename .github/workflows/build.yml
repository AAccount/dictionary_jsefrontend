name: Manual Java Workspace Build & Auto-Release

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [dependency_updated]

# ⚠️ CRITICAL: Gives GitHub permission to create tags and publish releases
permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the JSE FrontEnd code
      - name: Checkout JSEFrontEnd
        uses: actions/checkout@v4.2.2
        with:
          path: JSEFrontEnd

      # 2. Pull down the DictionaryCore code
      - name: Checkout DictionaryCore
        uses: actions/checkout@v4.2.2
        with:
          repository: AAccount/dictionary_core
          path: DictionaryCore

      # 3. Pull down the CedictParser code
      - name: Checkout CedictParser
        uses: actions/checkout@v4.2.2
        with:
          repository: AAccount/dictionary_cedictparser
          path: CedictParser

      # 4. Set up the Java JDK
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21' # Match your local VS Code Java version
          distribution: 'temurin'

      # 5. Gather all java files across folders and compile them
      - name: Compile Java Code
        run: |
          mkdir -p bin
          # Find all .java files across the three source directories
          find CedictParser/src DictionaryCore/src JSEFrontEnd/src -name "*.java" > sources.txt
          
          # Compile using the JAR file already inside your checked-out DictionaryCore folder
          javac -cp "DictionaryCore/lib/sqlite-jdbc-3.53.2.0.jar" -d bin @sources.txt

      # 6. Extract the SQLite JAR into the bin folder for a standalone app
      - name: Extract Dependencies
        run: |
          cd bin
          jar -xf ../DictionaryCore/lib/sqlite-jdbc-3.53.2.0.jar
          # Remove the embedded manifest file so it doesn't overwrite your main one
          rm -rf META-INF/MANIFEST.MF

      # 7. Package compiled class files into a single production JAR
      - name: Package JAR file
        run: |
          echo "Main-Class: dt.jdictionary.App" > manifest.txt
          
          # Package the bin contents into a final jar
          jar cfm DictionaryJava.jar manifest.txt -C bin .

      # NEW STEP 8: Create a custom sources zip file mirroring your local structure
      - name: Create Custom Sources Archive
        run: |
          # Create a clean folder structure to zip up
          mkdir -p combined_sources/JSEFrontEnd
          mkdir -p combined_sources/DictionaryCore
          mkdir -p combined_sources/CedictParser
          
          # Copy your src folders into it
          cp -r JSEFrontEnd/src combined_sources/JSEFrontEnd/
          cp -r DictionaryCore/src combined_sources/DictionaryCore/
          cp -r CedictParser/src combined_sources/CedictParser/
          
          # Compress the matching sources folder structure
          cd combined_sources
          zip -r ../sources.zip .

      # 9. Extract previous release info and compile cross-repo change logs
      - name: Generate Multi-Repo Release Notes
        id: notes_gen
        run: |
          # A. Find the last version tag created on the Frontend Repo
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Initialize the changelog text file
          echo "### 🔄 Combined Changelog" > changelog.md
          
          # B. Pull logs for JSE Frontend
          echo -e "\n#### 🖥️ JSE FrontEnd Changes:" >> changelog.md
          if [ -z "$LATEST_TAG" ]; then
            git log --oneline -n 10 --pretty=format:"* %s (%an)" >> changelog.md
          else
            git log "$LATEST_TAG..HEAD" --pretty=format:"* %s (%an)" >> changelog.md || echo "* Minor maintenance tweaks" >> changelog.md
          fi
          
          # C. Pull logs for DictionaryCore
          echo -e "\n\n#### 🗃️ Dictionary Core Changes:" >> changelog.md
          cd DictionaryCore
          # Find the core commit history relative to the timeframe of our last release
          if [ -z "$LATEST_TAG" ]; then
            git log --oneline -n 10 --pretty=format:"* %s (%an)" >> ../changelog.md
          else
            # Grabs core commits since the date of our last frontend release tag
            TAG_DATE=$(git --git-dir=../.git log -1 --format=%ai "$LATEST_TAG")
            git log --since="$TAG_DATE" --pretty=format:"* %s (%an)" >> ../changelog.md || echo "* No structural changes" >> ../changelog.md
          fi
          cd ..
          
          # D. Pull logs for CedictParser
          echo -e "\n\n#### ⚙️ Cedict Parser Changes:" >> changelog.md
          cd CedictParser
          if [ -z "$LATEST_TAG" ]; then
            git log --oneline -n 10 --pretty=format:"* %s (%an)" >> ../changelog.md
          else
            TAG_DATE=$(git --git-dir=../.git log -1 --format=%ai "$LATEST_TAG")
            git log --since="$TAG_DATE" --pretty=format:"* %s (%an)" >> ../changelog.md || echo "* No utility changes" >> ../changelog.md
          fi
          cd ..
          
          # E. Append the asset disclaimer warnings directly onto the note text
          echo -e "\n\n### 📦 Download Assets" >> changelog.md
          echo "* **\`DictionaryJava.jar\`** - Fully compiled standalone application." >> changelog.md
          echo "* **\`sources.zip\`** - **[USE THIS FOR SOURCE CODE]** Contains the combined Java source code snapshots across all 3 dependencies." >> changelog.md
          echo -e "\n⚠️ **CRITICAL WARNING:** Do *not* download the default \`Source code (.zip)\` links at the bottom of this page. They are missing the core dictionary and parser engines." >> changelog.md

      # 10. Create a unique Version Tag based on the exact date and time
      - name: Generate Release Tag
        id: tag_gen
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M')"
          echo "generated_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      # 11. Create a GitHub Release reading straight from our custom text file
      - name: Deploy GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_gen.outputs.generated_tag }}
          name: "Automated Build: ${{ steps.tag_gen.outputs.generated_tag }}"
          body_path: changelog.md  # Reads the multi-repository markdown file
          draft: false
          prerelease: false
          files: |
            DictionaryJava.jar
            sources.zip
